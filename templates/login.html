<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — TGM Finance</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0b1f35 0%, #0f3352 50%, #0d4a3a 100%);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .login-card {
      background: #fff;
      border-radius: 20px;
      padding: 44px 44px 36px;
      width: 100%; max-width: 400px;
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
    }
    .login-logo {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 30px;
    }
    .login-badge {
      width: 46px; height: 46px; border-radius: 12px;
      background: linear-gradient(135deg, #0d9488, #14b8a6);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 900; color: #fff;
    }
    .login-brand strong { display: block; font-size: 20px; font-weight: 800; color: #0b1f35; }
    .login-brand span   { font-size: 12px; color: #5f7d90; letter-spacing: 1px; text-transform: uppercase; }
    h2 { font-size: 18px; font-weight: 700; margin-bottom: 6px; color: #1a3040; }
    p.sub { font-size: 13.5px; color: #5f7d90; margin-bottom: 26px; }
    .login-card .form-group { margin-bottom: 16px; }
    .login-card label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; color: #1a3040; }
    .login-card input { width: 100%; padding: 10px 14px; border: 1.5px solid #d4e3ed; border-radius: 10px; font-size: 14px; outline: none; }
    .login-card input:focus { border-color: #0d9488; }
    .login-btn {
      width: 100%; padding: 12px;
      background: linear-gradient(135deg, #0d9488, #14b8a6);
      color: #fff; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      margin-top: 8px;
      transition: opacity .15s;
    }
    .login-btn:hover { opacity: .88; }
    .login-err {
      background: #fee2e2; color: #b91c1c;
      border: 1px solid #fecaca;
      border-radius: 9px; padding: 10px 14px;
      font-size: 13.5px; margin-bottom: 16px;
    }
    /* ── Festive snowflakes ── */
    .snowflake {
      position: fixed;
      top: -24px;
      color: #fff;
      pointer-events: none;
      user-select: none;
      z-index: 10;
      animation: snowFall linear infinite;
      text-shadow: 0 0 4px rgba(180,230,255,.7);
    }
    @keyframes snowFall {
      0%   { transform: translateY(0)    translateX(0)    rotate(0deg);   opacity: 1; }
      20%  { transform: translateY(20vh) translateX(14px) rotate(72deg);  }
      40%  { transform: translateY(40vh) translateX(-10px) rotate(144deg); }
      60%  { transform: translateY(60vh) translateX(16px) rotate(216deg); }
      80%  { transform: translateY(80vh) translateX(-8px) rotate(288deg); }
      100% { transform: translateY(108vh) translateX(4px) rotate(360deg); opacity: 0; }
    }
    /* ── Christmas hat on badge ── */
    .login-badge-wrap {
      position: relative;
      display: inline-flex;
      flex-shrink: 0;
    }
    .xmas-hat {
      position: absolute;
      top: -24px;
      left: 0px;
      width: 46px;
      height: 38px;
      pointer-events: none;
      transform: rotate(-12deg);
      transform-origin: bottom center;
      z-index: 2;
    }
    /* ── Festive footer note ── */
    .festive-note {
      text-align: center;
      font-size: 12px;
      color: #8faab8;
      margin-top: 20px;
      letter-spacing: .3px;
    }
    .festive-note span { color: #e8514a; }
  </style>
</head>
<body>
  <!-- Snowflakes injected by JS -->
  <div class="login-card">
    <div class="login-logo">
      <div class="login-badge-wrap">
        <!-- Santa hat SVG -->
        <svg class="xmas-hat" viewBox="0 0 42 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- red cone -->
          <polygon points="21,1 40,30 2,30" fill="#C41E3A"/>
          <!-- white brim -->
          <rect x="0" y="27" width="42" height="9" rx="4.5" fill="#ffffff"/>
          <!-- hat band stripe -->
          <rect x="2" y="27" width="38" height="3" rx="1.5" fill="#e8e8e8"/>
          <!-- pompom -->
          <circle cx="21" cy="4" r="5" fill="#ffffff"/>
          <circle cx="21" cy="4" r="3.5" fill="#f0f0f0"/>
        </svg>
        <div class="login-badge">T</div>
      </div>
      <div class="login-brand">
        <strong>TGM Finance</strong>
        <span>Commission Tracker</span>
      </div>
    </div>
    <h2>Welcome back</h2>
    <p class="sub">Sign in to access your commission dashboard.</p>

    {% if error %}
      <div class="login-err">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <label>Email address</label>
        <input type="email" name="email" required autofocus placeholder="you@tgmfinance.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="login-btn">Sign in</button>
    </form>
    <div class="festive-note">❄ Wishing you a joyful festive season <span>🎄</span></div>
  </div>

  <script>
    (function () {
      var chars = ['❄', '❅', '❆', '✦', '·'];
      var count = 48;
      for (var i = 0; i < count; i++) {
        var el = document.createElement('span');
        el.className = 'snowflake';
        el.textContent = chars[Math.floor(Math.random() * chars.length)];
        var size = 8 + Math.random() * 18;
        el.style.left = (Math.random() * 100) + 'vw';
        el.style.fontSize = size + 'px';
        el.style.opacity = (0.3 + Math.random() * 0.65).toFixed(2);
        el.style.animationDuration = (5 + Math.random() * 9) + 's';
        el.style.animationDelay = (-Math.random() * 14) + 's';
        document.body.appendChild(el);
      }
    })();
  </script>
</body>
</html>
